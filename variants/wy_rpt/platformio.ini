[wy_rpt]
extends = nrf52_base
board = seeed-xiao-afruitnrf52-nrf52840
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -D NRF52_PLATFORM -D XIAO_NRF52
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/wy_rpt
  -I src/helpers/nrf52
  -D P_LORA_TX_LED=11
  -D DISPLAY_CLASS=SSD1306Display
  -D DISPLAY_ROTATION=2
   -D USE_SX1268
   -D RADIO_CLASS=CustomSX1268
  -D WRAPPER_CLASS=CustomSX1268Wrapper
  -D P_LORA_DIO_1=D1
  -D P_LORA_RESET=D2
  -D P_LORA_BUSY=D3
  -D P_LORA_NSS=D4
  -D SX126X_RXEN=D5
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_USER_BTN=0
  -D PIN_WIRE_SCL=7
  -D PIN_WIRE_SDA=6
  -UENV_INCLUDE_GPS
lib_deps = ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}

[wy_rpt_e22_30dbm]
extends = wy_rpt
; E22P-433M30S (SX1268 + PA): per its own datasheet power curve, +12dBm chip-level
; input yields ~30dBm real output at 429-440MHz. The old +20dBm value was calibrated
; for the E22-900M30S's PA (lower gain) and overdrives this module's PA into
; compression/distortion, degrading actual TX output rather than increasing it.
build_flags =
  ${wy_rpt.build_flags}
  -D MANUFACTURER_STRING='"WY_RPT-E22P-30dBm (Xiao_nrf52)"'
  -D LORA_TX_POWER=12
build_src_filter = ${wy_rpt.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<../variants/wy_rpt>

;;; abstracted firmware roles

[wy_rpt_companion_radio_ble]
extends = wy_rpt
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${wy_rpt.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -I examples/companion_radio/ui-new
  -D QSPIFLASH=1
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${wy_rpt.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${wy_rpt.lib_deps}
  densaugeo/base64 @ ~1.4.0

[wy_rpt_companion_radio_usb]
extends = wy_rpt
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${wy_rpt.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -I examples/companion_radio/ui-new
  -D QSPIFLASH=1
  -D ENABLE_USB_INTERFACE
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${wy_rpt.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${wy_rpt.lib_deps}
  densaugeo/base64 @ ~1.4.0

[wy_rpt_repeater]
extends = wy_rpt
build_flags =
  ${wy_rpt.build_flags}
  -D ADVERT_NAME='"WY_RPT Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${wy_rpt.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater/*.cpp>

;;; hardware + firmware variants


;;;    30dBm EBYTE E22P-433M30S variants

[env:wy_rpt_30dbm_companion_radio_usb]
extends =
   wy_rpt_e22_30dbm
   wy_rpt_companion_radio_usb
build_flags =
   ${wy_rpt_companion_radio_usb.build_flags}
   ${wy_rpt_e22_30dbm.build_flags}
build_src_filter =
   ${wy_rpt_companion_radio_usb.build_src_filter}
   ${wy_rpt_e22_30dbm.build_src_filter}

[env:wy_rpt_30dbm_companion_radio_ble]
extends =
   wy_rpt_e22_30dbm
   wy_rpt_companion_radio_ble
build_flags =
   ${wy_rpt_companion_radio_ble.build_flags}
   ${wy_rpt_e22_30dbm.build_flags}
build_src_filter =
   ${wy_rpt_companion_radio_ble.build_src_filter}
   ${wy_rpt_e22_30dbm.build_src_filter}

[env:wy_rpt_30dbm_repeater]
extends =
   wy_rpt_e22_30dbm
   wy_rpt_repeater
build_flags =
   ${wy_rpt_repeater.build_flags}
   ${wy_rpt_e22_30dbm.build_flags}
build_src_filter =
   ${wy_rpt_repeater.build_src_filter}
   ${wy_rpt_e22_30dbm.build_src_filter}
